name: Trigger Site Rebuild

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger my-digital-garden rebuild
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.DEPLOY_TOKEN }}" \
            https://api.github.com/repos/jeevananthamp16/my-digital-garden/dispatches \
            -d '{"event_type":"content-update","client_payload":{"source":"garden-content"}}'
